name: RadarSmart BR — Autonomous Pipeline & Pages Deploy

on:
  push:
    branches: [main]
  schedule:
    # Executa automaticamente 4x ao dia na nuvem (00:17, 06:17, 12:17, 18:17 UTC)
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: radarsmart-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest suite & TypeScript check
        run: |
          npx next typegen
          npm test
          npm run typecheck

      - name: Run autonomous data pipeline (collect, audit, score, guides, Telegram)
        env:
          NEXT_PUBLIC_SITE_URL: https://renddre2.github.io/radarsmart-br
          MAGALU_STORE_SLUG: ${{ vars.MAGALU_STORE_SLUG }}
          AMAZON_PARTNER_TAG: ${{ vars.AMAZON_PARTNER_TAG }}
          SHOPEE_AFFILIATE_ID: ${{ vars.SHOPEE_AFFILIATE_ID }}
          SHOPEE_APP_ID: ${{ vars.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          AWIN_AFFILIATE_ID: ${{ vars.AWIN_AFFILIATE_ID }}
          AWIN_MID_MOTOROLA: ${{ vars.AWIN_MID_MOTOROLA }}
          AWIN_MID_FASTSHOP: ${{ vars.AWIN_MID_FASTSHOP }}
          AWIN_MID_TROCAFONE: ${{ vars.AWIN_MID_TROCAFONE }}
          AWIN_MID_KABUM: ${{ vars.AWIN_MID_KABUM }}
          LOMADEE_SOURCE_ID: ${{ vars.LOMADEE_SOURCE_ID }}
          ML_AFFILIATE_MAP_JSON: ${{ vars.ML_AFFILIATE_MAP_JSON }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run pipeline

      - name: Persist updated verified snapshot & price history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update verified smartphone offers snapshot [skip ci]"
            git push
          fi

      - name: Build static portal for GitHub Pages
        env:
          NEXT_PUBLIC_BASE_PATH: /radarsmart-br
          NEXT_PUBLIC_SITE_URL: https://renddre2.github.io/radarsmart-br
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_ANALYTICS_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_ANALYTICS_WEBHOOK_URL }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
